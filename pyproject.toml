[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyconduit"
version = "0.1.0"
description = "PyConduit — a web-based XMPP chat client that bridges browser WebSockets to an XMPP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "slixmpp>=1.8.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
pyconduit = "pyconduit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyconduit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
