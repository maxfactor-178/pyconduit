<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PyConduit</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <header id="brand">
        <span id="brand-title">PyConduit</span>
      </header>

      <div class="presence-row">
        <span class="presence-dot" id="my-dot"></span>
        <select id="presence-select" title="Set your presence">
          <option value="online">Online</option>
          <option value="away">Away</option>
          <option value="dnd">Do not disturb</option>
          <option value="xa">Extended away</option>
          <option value="offline">Invisible</option>
        </select>
        <button id="settings-btn" title="Settings">⚙</button>
      </div>

      <div id="subscription-banner" class="hidden"></div>

      <div class="section-head">
        <span>Direct messages</span>
        <button id="add-contact-btn" title="Add contact">＋</button>
      </div>
      <ul id="contacts" class="list"></ul>

      <div class="section-head">
        <span>Rooms</span>
        <button id="join-room-btn" title="Join room by address">＋</button>
      </div>
      <ul id="rooms" class="list"></ul>
      <button id="discover-btn" class="link-btn">Discover rooms…</button>
    </aside>

    <!-- Main conversation -->
    <main id="main">
      <header id="convo-header">
        <span id="convo-avatar"></span>
        <span id="convo-title">Select a conversation</span>
        <span id="convo-sub"></span>
        <button id="leave-room-btn" class="header-btn hidden" title="Leave room">Leave</button>
      </header>

      <div id="messages-wrap">
        <button id="load-older" class="hidden">Load older messages</button>
        <div id="messages"></div>
      </div>

      <div id="occupants" class="hidden"></div>

      <form id="composer">
        <input id="composer-input" type="text" autocomplete="off"
               placeholder="Type a message…" disabled />
        <button id="send-btn" type="submit" disabled>Send</button>
      </form>
    </main>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Settings</h3>
      <label class="switch-row">
        <input type="checkbox" id="sound-toggle" />
        Notification sounds
      </label>
      <div class="modal-actions">
        <button id="settings-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Discover rooms modal -->
  <div id="discover-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Discover rooms</h3>
      <div class="row">
        <input id="discover-server" type="text" placeholder="conference.example.com" />
        <button id="discover-go">Browse</button>
      </div>
      <ul id="discover-results" class="list"></ul>
      <div class="modal-actions">
        <button id="discover-close">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/sound.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
